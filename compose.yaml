name: electoflow

x-backend-environment: &backend-environment
  APP_NAME: ElectoFlow
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: "3306"
  DB_DATABASE: electoflow
  DB_USERNAME: electoflow
  DB_PASSWORD: electoflow
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: log

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: electoflow
      MYSQL_USER: electoflow
      MYSQL_PASSWORD: electoflow
      MYSQL_ROOT_PASSWORD: electoflow-root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The single-process Laravel development server can make an HTTP probe
      # wait behind another request. A TCP connection is a faster readiness check.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The first run installs Composer packages, migrates, and seeds MySQL.
      # Failures do not count during this window, but success is accepted at once.
      start_period: 5m
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      <<: *backend-environment
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
